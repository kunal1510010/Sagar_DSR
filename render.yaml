# One-click-ish deploy blueprint for Render (https://render.com).
# Creates a free Postgres DB + a free web service and wires them together.
services:
  - type: web
    name: sagar-dsr
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret
      - key: DATABASE_URL
        fromDatabase:
          name: sagar-dsr-db
          property: connectionString
databases:
  - name: sagar-dsr-db
    plan: free
